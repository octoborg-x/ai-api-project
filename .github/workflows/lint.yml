name: Lint and Auto-fix

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # Pylint itself is a diagnostic linter; it does not provide a general
      # safe auto-fix mode. Ruff handles the mechanically fixable Python
      # lint/format issues before Pylint is used as the quality gate.
      - name: Auto-fix safe lint and formatting issues
        run: |
          ruff check . --fix
          ruff format .
          isort .
          black .

      - name: Commit auto-fixes
        run: |
          if git diff --quiet; then
            echo "No auto-fixes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: auto-fix lint issues"
          git push

      - name: Run Pylint quality gate
        run: |
          pylint app.py models.py llm_client.py evals --fail-under=8.0
